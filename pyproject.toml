[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otosage-aws-platform"
version = "0.1.0"
description = "AWS-native event-driven Healthcare AI and SageMaker MLOps portfolio project."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26","pandas>=2.2","Pillow>=10.2","scikit-learn>=1.4","torch>=2.2","torchvision>=0.17"]

[project.optional-dependencies]
aws = ["boto3>=1.34", "sagemaker>=2.220", "requests>=2.32"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools]
py-modules = []
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.pytest.ini_options]
testpaths = ["tests"]
