name: Hugging Face Static Space

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "hf_static/**"
      - "scripts/publish_static_space.py"
      - ".github/workflows/huggingface.yml"

permissions:
  contents: read

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Hub dependency
        run: pip install huggingface_hub==1.30.0
      - name: Smoke-test static application
        run: |
          python -m http.server 8000 --directory hf_static >/tmp/otosage-static.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/otosage-static.log
          exit 1
      - name: Publish free Static Space to Hugging Face
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          test -n "$HF_TOKEN" || { echo "HF_TOKEN is not configured in this repository"; exit 1; }
          python scripts/publish_static_space.py --repo-id singhankit491/otosage-aws --folder hf_static
